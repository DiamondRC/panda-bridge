# meta-custom
# Holds panda-server + the bridge, kernel/DTS RT tweaks and the LQR FPGA .ipk,
the irq-affinity systemd unit.

# Add conf and recipes-* to BBPATH / BBFILES.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "meta-custom"

BBFILE_PATTERN_meta-custom = "^${LAYERDIR}/"
# Higher than meta-panda (6) so appends/overrides win
BBFILE_PRIORITY_meta-custom = "8"

# A dependancy to our recipes
LAYERDEPENDS_meta-custom = "core meta-panda"
LAYERSERIES_COMPAT_meta-custom = "kirkstone langdale"
